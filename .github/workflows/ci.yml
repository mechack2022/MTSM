name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify runs unit tests AND integration tests, so a separate "test" step is redundant
      - name: Run unit and integration tests
        working-directory: ./backend
        run: ./mvnw verify

      - name: Build JAR
        working-directory: ./backend
        run: ./mvnw package -DskipTests

  client:
    name: Client Tests
    if: false   # TODO: remove this line once the client is set up
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint
        working-directory: ./client
        run: npm run lint

      - name: Build
        working-directory: ./client
        run: npm run build

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend]   # TODO: add client back: [backend, client]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build backend   # TODO: change to "docker compose build" when client is ready