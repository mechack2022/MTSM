spring:
  application:
    name: school-attendance-api

  profiles:
    active: dev

  security:
    jwt:
      secret-key: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0cy1vbmx5LTEyMzQ1Njc4OTA=}
      expiration-time: 86400000 # 24 hours in milliseconds

  datasource:
    url: ${DB_URL}
    username: attendance_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # HikariCP tuning for better performance under load
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000 # 20 seconds

  jpa:
    hibernate:
      ddl-auto: validate  # NEVER auto-DDL; Liquibase handles schema exclusively
    show-sql: false
    open-in-view: false   # CRITICAL: Prevents lazy-loading exceptions when serializing JSON in REST controllers
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Email Configuration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
        debug: true
    default-encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.school.attendance: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: true
    admin-password: ${SEED_ADMIN_PASSWORD}
  mail:
    from: ${MAIL_FROM:noreply@aceedumanage.com}
    app-name: ACE EDUManage
    app-url: ${APP_URL:http://localhost:3000}