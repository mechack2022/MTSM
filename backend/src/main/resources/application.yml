spring:
  application:
    name: school-attendance-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/attendance_db}
    username: ${DB_USER:attendance_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Never auto-DDL; migrations only
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.school.attendance: INFO
    org.springframework.web: INFO
